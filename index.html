<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subho Vijaya Dashami</title>
    
    <!-- Google AdSense Verification Code -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-5855481229492425" crossorigin="anonymous"></script>
    
    <style>
        body { 
            text-align: center; 
            font-family: sans-serif; 
            background-color: #ffecd2; 
            padding: 15px; 
            margin: 0;
        }
        h1 { color: #d32f2f; margin-top: 30px; font-size: 28px;}
        #greetingBox, #shareBox { display: none; margin-top: 20px; }
        
        input { 
            padding: 12px; 
            font-size: 16px; 
            border-radius: 8px; 
            border: 2px solid #d32f2f; 
            width: 80%; 
            max-width: 300px; 
        }
        
        .action-btn { 
            padding: 12px 25px; 
            font-size: 18px; 
            background-color: #d32f2f; 
            color: white; 
            border: none; 
            border-radius: 8px; 
            cursor: pointer; 
            margin-top: 15px; 
            font-weight: bold;
        }
        
        .whatsapp-btn { 
            background-color: #25D366; 
            width: 90%;
            max-width: 300px;
        }
        
        .ad-container { 
            margin: 20px auto; 
            min-height: 250px;
            background-color: transparent; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
        }
        
        .footer-links { 
            margin-top: 50px; 
            font-size: 14px; 
            padding-bottom: 20px;
        }
        .footer-links a { 
            color: #555; 
            text-decoration: none; 
            margin: 0 10px; 
        }
        
        #timerText {
            font-size: 16px;
            color: #555;
            font-weight: bold;
            margin: 15px 0;
        }
    </style>
</head>
<body>

    <!-- Hidden Audio Player -->
    <audio id="dhakAudio" src="dhak.mp3" loop></audio>

    <h1>Subho Vijaya Dashami!</h1>

    <!-- First Screen: Name Input or Receiver Button -->
    <div id="inputBox">
        <p style="font-size: 18px; color: #333;" id="instructionText">Enter your name to create your greeting:</p>
        <input type="text" id="userName" placeholder="Type your name here...">
        <br>
        <button class="action-btn" id="mainButton" onclick="createGreeting()">Create Greeting</button>
    </div>

    <!-- Second Screen: Greeting, Ads, and Share Button -->
    <div id="greetingBox">
        <h2 id="greetingMessage" style="color: #d32f2f; font-size: 24px;"></h2>
        
        <p id="timerText">Please wait <span id="timer" style="color: red; font-size: 20px;">5</span> seconds to unlock the share button...</p>

        <!-- Ad Slot 1 -->
        <div class="ad-container">
            <ins class="adsbygoogle"
                 style="display:block"
                 data-ad-client="ca-pub-5855481229492425"
                 data-ad-slot="auto" 
                 data-ad-format="auto"
                 data-full-width-responsive="true"></ins>
            <script>
                 (adsbygoogle = window.adsbygoogle || []).push({});
            </script>
        </div>

        <!-- Ad Slot 2 -->
        <div class="ad-container">
            <ins class="adsbygoogle"
                 style="display:block"
                 data-ad-client="ca-pub-5855481229492425"
                 data-ad-slot="auto" 
                 data-ad-format="auto"
                 data-full-width-responsive="true"></ins>
            <script>
                 (adsbygoogle = window.adsbygoogle || []).push({});
            </script>
        </div>

        <!-- Hidden Share Button -->
        <div id="shareBox">
            <button class="action-btn whatsapp-btn" onclick="shareWhatsApp()">Share on WhatsApp</button>
        </div>
    </div>

    <div class="footer-links">
        <a href="about.html">About Us</a> | 
        <a href="privacy.html">Privacy Policy</a> | 
        <a href="contact.html">Contact Us</a>
    </div>

    <script>
        let sharedNameFromUrl = "";

        // Logic for when a friend opens the link you sent them
        window.onload = function() {
            const urlParams = new URLSearchParams(window.location.search);
            sharedNameFromUrl = urlParams.get('name');
            
            if (sharedNameFromUrl) {
                // Change the first screen to a tap-to-open button so audio can play
                document.getElementById("instructionText").innerHTML = `You received a special greeting from <b>${sharedNameFromUrl}</b>!`;
                document.getElementById("userName").style.display = "none";
                
                const btn = document.getElementById("mainButton");
                btn.innerText = "Open Greeting";
                btn.onclick = openSharedGreeting;
            }
        }

        function createGreeting() {
            const name = document.getElementById("userName").value;
            if (!name) {
                alert("Please type your name first!");
                return;
            }
            
            // Play Audio
            document.getElementById("dhakAudio").play();
            
            // Hide input, show greeting
            document.getElementById("inputBox").style.display = "none";
            document.getElementById("greetingBox").style.display = "block";
            document.getElementById("greetingMessage").innerText = "Subho Vijaya Dashami, " + name + "!";
            
            // 5 Second Timer Logic
            startTimer();
        }

        function openSharedGreeting() {
            // Play Audio
            document.getElementById("dhakAudio").play();
            
            // Hide input, show greeting
            document.getElementById("inputBox").style.display = "none";
            document.getElementById("greetingBox").style.display = "block";
            document.getElementById("greetingMessage").innerText = "Subho Vijaya Dashami to you from " + sharedNameFromUrl + "!";
            
            // Remove timer for friends receiving the link
            document.getElementById("timerText").style.display = "none";
            document.getElementById("shareBox").style.display = "block";
        }

        function startTimer() {
            let timeLeft = 5;
            const timerInterval = setInterval(() => {
                timeLeft--;
                document.getElementById("timer").innerText = timeLeft;
                
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    document.getElementById("timerText").style.display = "none";
                    document.getElementById("shareBox").style.display = "block";
                }
            }, 1000);
        }

        function shareWhatsApp() {
            const name = document.getElementById("userName").value || sharedNameFromUrl;
            const url = window.location.href.split('?')[0] + "?name=" + encodeURIComponent(name);
            const text = `*${name}* has sent you a special Vijaya Dashami greeting! Click here to see it: ${url}`;
            window.open("https://api.whatsapp.com/send?text=" + encodeURIComponent(text));
        }
    </script>
</body>
</html>
